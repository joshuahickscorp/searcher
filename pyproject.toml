[project]
name = "searcher"
version = "0.1.0"
description = "Evidence-ranked multimodal search engine for hard-to-find physical products."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "pillow>=10.4",
    "httpx>=0.27",
    "selectolax>=0.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "python-multipart>=0.0.32",
    "numpy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "hypothesis>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    # starlette>=1.6 TestClient wants httpx2; plain httpx only raises a
    # DeprecationWarning, which our filterwarnings=error turns into a failure.
    "httpx2>=0.1",
]
# The VisionMCP donor is NOT declared here. It is not published to PyPI, and a
# `git+https` install of the audited SHA fails because that commit carries a
# gitlink with no .gitmodules entry (see docs/architecture/DONOR_SETUP.md).
# Install it with `scripts/setup_donor.sh`, which pins the SHA itself; the
# compatibility tests bind the same SHA and version at runtime.
browser = [
    "playwright>=1.40",
]
correspondence = [
    # opencv ships SIFT. Local correspondence is optional: absent it the
    # capability reports unavailable and everything else is unchanged.
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

vision = [
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.scripts]
searcher = "searcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "hypothesis>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    # starlette>=1.6 TestClient wants httpx2; plain httpx only raises a
    # DeprecationWarning, which our filterwarnings=error turns into a failure.
    "httpx2>=0.1",
    "coverage>=7.15.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/searcher"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# web/ is the static frontend plus its dev stub; neither is shipped Python.
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["searcher"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
no_implicit_reexport = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
mypy_path = "src"
packages = ["searcher"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "numpy", "torch", "torchvision", "torchvision.models", "visionmcp", "visionmcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "searcher.integrations.visionmcp.probe",
    "searcher.integrations.visionmcp.adapter",
]
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
markers = [
    "live_campaign: runs a live campaign; must run in its own pytest invocation (see scripts/test_all.sh)",
]
addopts = "-m 'not live_campaign'"
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::hypothesis.errors.NonInteractiveExampleWarning",
]
